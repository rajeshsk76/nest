<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nest</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      background: #f7f6f3;
      color: #1c1b19;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #161513; color: #eceae4; }
      a { color: #9ec5b0; }
    }
    main { max-width: 36rem; padding: 2rem; text-align: center; }
    h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 1rem; }
    p { margin: 0 0 1.5rem; font-size: 1.05rem; }
    nav { display: flex; gap: 1.25rem; justify-content: center; font-size: 0.95rem; }
    a { color: #2d6a4f; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Nest</h1>
    <p>Your tasks, in a file you own. No account required.</p>
    <nav>
      <a href="https://github.com/rajeshsk76/nest">GitHub</a>
      <a href="https://github.com/rajeshsk76/nest/releases">Releases</a>
    </nav>
  </main>
</body>
</html>
